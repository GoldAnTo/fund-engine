[project]
name = "industry-evidence-workspace"
version = "0.1.0"
description = "Industry research evidence ledger and workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2",
    "neo4j>=5.14",
    "openai>=1.0",
    "json-repair>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "pg_only: requires a live PostgreSQL database (set TEST_DATABASE_URL)",
    "neo4j_only: requires a live Neo4j (set NEO4J_URL)",
]
