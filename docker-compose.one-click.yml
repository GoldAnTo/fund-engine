name: fund-engine-one-click

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ONE_CLICK_POSTGRES_DB:?}
      POSTGRES_USER: ${ONE_CLICK_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${ONE_CLICK_POSTGRES_PASSWORD:?}
    volumes:
      - fund-engine-one-click-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: fund-engine-one-click-backend:local
    build:
      context: ./backend
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: fund-engine-one-click-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - 127.0.0.1:8000:8000
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
      RESEARCH_TENANT_TOKENS: ${RESEARCH_TENANT_TOKENS:?}
      LLM_API_KEY: ${LLM_API_KEY:?}
      LLM_BASE_URL: ${LLM_BASE_URL:?}
      LLM_MODEL: ${LLM_MODEL:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  research-worker:
    image: fund-engine-one-click-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.scripts.run_research_worker", "--loop", "--poll-seconds", "1"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
      LLM_API_KEY: ${LLM_API_KEY:?}
      LLM_BASE_URL: ${LLM_BASE_URL:?}
      LLM_MODEL: ${LLM_MODEL:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m app.scripts.check_worker_heartbeat --worker-kind research_run --worker-id $$HOSTNAME --max-age-seconds 300"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  acquisition-worker:
    image: fund-engine-one-click-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.scripts.run_acquisition_worker", "--loop", "--poll-seconds", "1"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
      GILDATA_TOKEN: ${GILDATA_TOKEN:?}
      ACQUISITION_ENABLED_ADAPTERS: ${ACQUISITION_ENABLED_ADAPTERS:?}
      LLM_API_KEY: ${LLM_API_KEY:?}
      LLM_BASE_URL: ${LLM_BASE_URL:?}
      LLM_MODEL: ${LLM_MODEL:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m app.scripts.check_worker_heartbeat --worker-kind acquisition --worker-id $$HOSTNAME --max-age-seconds 300"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  fund-engine-one-click-data:
    name: fund-engine-one-click-data
