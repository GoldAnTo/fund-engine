name: fund-engine-one-click

x-database-pool-environment: &database-pool-environment
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-2}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-2}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-300}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: ${ONE_CLICK_POSTGRES_MEMORY_LIMIT:-1536m}
    cpus: ${ONE_CLICK_POSTGRES_CPU_LIMIT:-1.5}
    environment:
      POSTGRES_DB: ${ONE_CLICK_POSTGRES_DB:?}
      POSTGRES_USER: ${ONE_CLICK_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${ONE_CLICK_POSTGRES_PASSWORD:?}
    volumes:
      - fund-engine-one-click-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ${ONE_CLICK_BACKEND_IMAGE:-fund-engine-one-click-backend:local}
    build:
      context: ./backend
    restart: "no"
    command:
      - sh
      - -eu
      - -c
      - alembic upgrade head && python -m app.scripts.verify_company_research_schema && python -m app.scripts.load_product_foundation_fixture
    environment:
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
    depends_on:
      postgres:
        condition: service_healthy

  file-store-init:
    image: ${ONE_CLICK_BACKEND_IMAGE:-fund-engine-one-click-backend:local}
    user: root
    restart: "no"
    command: ["sh", "-eu", "-c", "install -d -o app -g app -m 700 /data/research-files"]
    volumes:
      - fund-engine-one-click-files:/data/research-files

  api:
    image: ${ONE_CLICK_BACKEND_IMAGE:-fund-engine-one-click-backend:local}
    restart: unless-stopped
    mem_limit: ${ONE_CLICK_API_MEMORY_LIMIT:-1536m}
    cpus: ${ONE_CLICK_API_CPU_LIMIT:-1.5}
    ports:
      - 127.0.0.1:${ONE_CLICK_API_PORT:-8000}:8000
    environment:
      <<: *database-pool-environment
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
      RESEARCH_TENANT_TOKENS: ${RESEARCH_TENANT_TOKENS:?}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GILDATA_TOKEN: ${GILDATA_TOKEN:-}
    volumes:
      - fund-engine-one-click-files:/data/research-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      file-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  research-worker:
    image: ${ONE_CLICK_BACKEND_IMAGE:-fund-engine-one-click-backend:local}
    restart: unless-stopped
    mem_limit: ${ONE_CLICK_RESEARCH_WORKER_MEMORY_LIMIT:-768m}
    cpus: ${ONE_CLICK_RESEARCH_WORKER_CPU_LIMIT:-1.0}
    command: ["python", "-m", "app.scripts.run_research_worker", "--loop", "--poll-seconds", "1"]
    environment:
      <<: *database-pool-environment
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - fund-engine-one-click-files:/data/research-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      file-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m app.scripts.check_worker_heartbeat --worker-kind research_run --worker-id $$HOSTNAME --max-age-seconds 300"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  acquisition-worker:
    image: ${ONE_CLICK_BACKEND_IMAGE:-fund-engine-one-click-backend:local}
    restart: unless-stopped
    mem_limit: ${ONE_CLICK_ACQUISITION_WORKER_MEMORY_LIMIT:-768m}
    cpus: ${ONE_CLICK_ACQUISITION_WORKER_CPU_LIMIT:-1.0}
    command: ["python", "-m", "app.scripts.run_acquisition_worker", "--loop", "--poll-seconds", "1"]
    environment:
      <<: *database-pool-environment
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
      GILDATA_TOKEN: ${GILDATA_TOKEN:-}
      ACQUISITION_ENABLED_ADAPTERS: ${ACQUISITION_ENABLED_ADAPTERS:-sse,szse}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - fund-engine-one-click-files:/data/research-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      file-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m app.scripts.check_worker_heartbeat --worker-kind acquisition --worker-id $$HOSTNAME --max-age-seconds 300"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  company-research-worker:
    image: ${ONE_CLICK_BACKEND_IMAGE:-fund-engine-one-click-backend:local}
    restart: unless-stopped
    mem_limit: ${ONE_CLICK_COMPANY_RESEARCH_WORKER_MEMORY_LIMIT:-1280m}
    cpus: ${ONE_CLICK_COMPANY_RESEARCH_WORKER_CPU_LIMIT:-1.5}
    command: ["python", "-m", "app.scripts.run_company_research_worker", "--loop", "--poll-seconds", "1"]
    environment:
      <<: *database-pool-environment
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${ONE_CLICK_POSTGRES_USER:?}:${ONE_CLICK_POSTGRES_PASSWORD:?}@postgres:5432/${ONE_CLICK_POSTGRES_DB:?}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - fund-engine-one-click-files:/data/research-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      file-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m app.scripts.check_worker_heartbeat --worker-kind company_research --worker-id $$HOSTNAME --max-age-seconds 300"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  api-proxy:
    image: ${ONE_CLICK_API_PROXY_IMAGE:-fund-engine-one-click-api-proxy:local}
    build:
      context: ./deploy/api-proxy
    restart: unless-stopped
    mem_limit: ${ONE_CLICK_API_PROXY_MEMORY_LIMIT:-256m}
    cpus: ${ONE_CLICK_API_PROXY_CPU_LIMIT:-0.5}
    ports:
      - 127.0.0.1:${ONE_CLICK_API_PROXY_PORT:-8080}:8080
    environment:
      RESEARCH_BEARER_TOKEN: ${RESEARCH_BEARER_TOKEN:?}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  fund-engine-one-click-data:
    name: ${ONE_CLICK_POSTGRES_VOLUME:-fund-engine-one-click-data}
  fund-engine-one-click-files:
    name: ${ONE_CLICK_FILES_VOLUME:-fund-engine-one-click-files}
