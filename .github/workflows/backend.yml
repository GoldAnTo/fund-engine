name: backend-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".nvmrc"
      - "README.md"
      - "docs/evaluation/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".nvmrc"
      - "README.md"
      - "docs/evaluation/**"
      - ".github/workflows/backend.yml"

jobs:
  pytest:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # 默认 sqlite；pg_only / neo4j_only 测试在无对应环境变量时自动跳过
      - run: python -m pytest -q
        working-directory: backend

  gateway-postgres:
    name: Gateway PostgreSQL migration guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway_ci
          POSTGRES_PASSWORD: gateway_ci
          POSTGRES_DB: gateway_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_ci -d gateway_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # This is deliberately a required non-skipped PG path: it covers the
      # released 0072 preflight, successor 0073/0074 DDL, runtime trigger
      # auth, tamper rejection, preflight writer serialization, cache/NUL
      # successor staging, and downgrade in a disposable schema.
      - run: >-
          python -m pytest -q
          tests/test_research_gateway_migration.py
          -k '0073_postgres or 0074_postgres'
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gateway_ci:gateway_ci@localhost:5432/gateway_ci

  company-research-live:
    name: Company Research 真实浏览器闭环
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -e "./backend[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: backend/.venv/bin/python -m pytest backend/tests/test_verify_live_company_research_ui.py -q
        env:
          RUN_LIVE_COMPANY_RESEARCH: "1"

  release-gate:
    name: 发布门禁（10 项检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # sqlite 默认；projection_rebuilds 无 NEO4J_URL 时跳过且不判失败
      - run: bash docs/evaluation/reproduce.sh

  recall-eval:
    name: 召回 A/B 评估（三案例，无下探回归门）
    runs-on: ubuntu-latest
    # actions/upload-artifact@v4 需要 actions: write 权限，否则 artifact step 403
    permissions:
      contents: read
      actions: write
    # GitHub Actions 不支持 job-level paths；跟随 workflow 的有效路径门禁运行。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # 脚本自带 exit 1 守卫：hybrid recall 在任意 (thesis, k) 低于 BM25 即非零退出
      - run: python scripts/eval_recall_ab.py
        working-directory: backend
      # 新报告上传为 artifact，方便对比历史结果（不进 git history 的不写盘）
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-ab-report
          path: docs/evaluation/reports/recall_ab_*.json
          retention-days: 14
