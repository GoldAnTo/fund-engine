name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/evaluation/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/evaluation/**"
      - ".github/workflows/backend.yml"

jobs:
  pytest:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # 默认 sqlite；pg_only / neo4j_only 测试在无对应环境变量时自动跳过
      - run: python -m pytest -q
        working-directory: backend

  release-gate:
    name: 发布门禁（10 项检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # sqlite 默认；projection_rebuilds 无 NEO4J_URL 时跳过且不判失败
      - run: bash docs/evaluation/reproduce.sh
