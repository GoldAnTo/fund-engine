name: backend-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".nvmrc"
      - "README.md"
      - "docs/evaluation/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".nvmrc"
      - "README.md"
      - "docs/evaluation/**"
      - ".github/workflows/backend.yml"

jobs:
  postgres:
    name: PostgreSQL 迁移与并发事务
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: fund_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d fund_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://audit:ci-disposable-only@127.0.0.1:5432/fund_engine_test
      TEST_DATABASE_URL: postgresql+psycopg://audit:ci-disposable-only@127.0.0.1:5432/fund_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest tests -m pg_only -q --junitxml=postgres-results.xml
        working-directory: backend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: backend/postgres-results.xml

  pytest:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # 默认 sqlite；pg_only / neo4j_only 测试在无对应环境变量时自动跳过
      - run: python -m pytest -q
        working-directory: backend

  release-gate:
    name: 发布门禁（10 项检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # sqlite 默认；projection_rebuilds 无 NEO4J_URL 时跳过且不判失败
      - run: bash docs/evaluation/reproduce.sh

  recall-eval:
    name: 召回 A/B 评估（三案例，无下探回归门）
    runs-on: ubuntu-latest
    # actions/upload-artifact@v4 需要 actions: write 权限，否则 artifact step 403
    permissions:
      contents: read
      actions: write
    # GitHub Actions 不支持 job-level paths；跟随 workflow 的有效路径门禁运行。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      # 脚本自带 exit 1 守卫：hybrid recall 在任意 (thesis, k) 低于 BM25 即非零退出
      - run: python scripts/eval_recall_ab.py
        working-directory: backend
      # 新报告上传为 artifact，方便对比历史结果（不进 git history 的不写盘）
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-ab-report
          path: docs/evaluation/reports/recall_ab_*.json
          retention-days: 14
